<script>
  // Skip SW + hard reload handlers in react-snap prerender (puppeteer) to prevent failures/flakiness
  var isReactSnap = (navigator && navigator.userAgent && navigator.userAgent.indexOf('ReactSnap') !== -1);

  if (!isReactSnap) {
    // Register service worker for chunk loading error handling
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js')
          .then(function (registration) {
            console.log('Service Worker registered successfully:', registration.scope);
          })
          .catch(function (error) {
            console.log('Service Worker registration failed:', error);
          });
      });
    }

    // Global error handler for chunk loading errors
    window.addEventListener('error', function (event) {
      if (event.filename && event.filename.includes('chunk')) {
        console.error('Chunk loading error detected:', event);
        // Clear cache and reload
        if ('caches' in window) {
          caches.keys().then(function (names) {
            names.forEach(function (name) { caches.delete(name); });
          });
        }
        setTimeout(function () { window.location.reload(); }, 1000);
      }
    });

    // Handle unhandled promise rejections (chunk loading failures)
    window.addEventListener('unhandledrejection', function (event) {
      if (event.reason && event.reason.message &&
        (event.reason.message.includes('Loading chunk') ||
          event.reason.message.includes('Unexpected token'))) {
        console.error('Chunk loading promise rejection:', event.reason);
        event.preventDefault();
        window.location.reload();
      }
    });
  }
</script>
